# Nginx reverse proxy สำหรับแอป VetCare Clinic
#
# ติดตั้งบน VPS (root) — แทน example.com ด้วยโดเมนของตัวเอง:
#   sed 's/example\.com/<โดเมน>/g' /home/deploy/app/nginx.conf > /etc/nginx/sites-available/vetcare
#   ln -sf /etc/nginx/sites-available/vetcare /etc/nginx/sites-enabled/
#   rm -f /etc/nginx/sites-enabled/default
#   nginx -t && systemctl reload nginx
#
# HTTPS: certbot --nginx -d <โดเมน> -d www.<โดเมน> --redirect

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
